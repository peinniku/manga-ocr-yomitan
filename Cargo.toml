[workspace]
resolver = "3"
members = ["crates/srs", "crates/core", "crates/app"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
picyomi-core = { path = "crates/core" }
picyomi-srs = { path = "crates/srs" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[profile.dev]
# Keep debug builds small: this machine has little free disk space.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
